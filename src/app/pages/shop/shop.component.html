<div class="shop">
  <div class="container">
    <div class="shop-header">
      <h1>Shop</h1>
      <p>Browse our collection</p>
    </div>
    <div class="shop-content">
      <aside class="filters">
        <h3>Filters</h3>
        <div class="filter-group">
          <h4>Category</h4>
          <label *ngFor="let category of categories">
            <input type="checkbox" [value]="category" (change)="onCategoryChange($event, category)"> {{ category }}
          </label>
        </div>
        <div class="filter-group">
          <h4>Price Range</h4>
          <label>
            <input type="checkbox" value="under50" (change)="onPriceRangeChange($event, 'under50')"> Under $50
          </label>
          <label>
            <input type="checkbox" value="50to100" (change)="onPriceRangeChange($event, '50to100')"> $50 - $100
          </label>
          <label>
            <input type="checkbox" value="100to200" (change)="onPriceRangeChange($event, '100to200')"> $100 - $200
          </label>
          <label>
            <input type="checkbox" value="over200" (change)="onPriceRangeChange($event, 'over200')"> Over $200
          </label>
        </div>
        <button class="btn btn-clear" (click)="clearFilters()">Clear Filters</button>
      </aside>
      <div class="products-grid">
        <app-product-card *ngFor="let product of filteredProducts" [product]="product"></app-product-card>
        <div *ngIf="filteredProducts.length === 0" class="no-products">
          <p>No products found matching your filters.</p>
        </div>
      </div>
    </div>
  </div>
</div>
