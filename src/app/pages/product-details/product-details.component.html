<div class="product-details">
  <div class="container">
    <div class="product-details-content">
      <div class="product-gallery">
        <div class="main-image"></div>
        <div class="thumbnail-images">
          <div class="thumbnail"></div>
          <div class="thumbnail"></div>
          <div class="thumbnail"></div>
        </div>
      </div>
      <div class="product-info">
        <h1>Classic White Tee</h1>
        <p class="product-category">Tops</p>
        <p class="product-price">$35.00</p>
        <p class="product-description">
          A classic white t-shirt made from 100% organic cotton. Perfect for everyday wear, 
          this versatile piece can be dressed up or down. Features a relaxed fit and premium quality fabric.
        </p>
        <div class="product-options">
          <div class="size-selector">
            <h4>Size</h4>
            <div class="sizes">
              <button class="size-btn">XS</button>
              <button class="size-btn">S</button>
              <button class="size-btn active">M</button>
              <button class="size-btn">L</button>
              <button class="size-btn">XL</button>
            </div>
          </div>
          <div class="color-selector">
            <h4>Color</h4>
            <div class="colors">
              <button class="color-btn active" style="background: #fff;"></button>
              <button class="color-btn" style="background: #000;"></button>
              <button class="color-btn" style="background: #333;"></button>
            </div>
          </div>
        </div>
        <div class="quantity-selector">
          <h4>Quantity</h4>
          <div class="quantity">
            <button class="qty-btn">-</button>
            <span class="qty-value">1</span>
            <button class="qty-btn">+</button>
          </div>
        </div>
        <div class="product-actions">
          <button class="btn btn-primary">Add to Cart</button>
          <button class="btn btn-secondary">Add to Wishlist</button>
        </div>
      </div>
    </div>
  </div>
</div>
