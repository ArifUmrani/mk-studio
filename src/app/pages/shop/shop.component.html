<div class="shop">
  <div class="container">
    <header class="shop-header">
      <p class="shop-eyebrow">Collection</p>
      <h1>Shop</h1>
      <p class="shop-intro">Explore refined essentials curated for modern everyday wear.</p>
    </header>

    <div class="shop-content">
      <aside class="filters">
        <div class="filters-header">
          <h3>Filters</h3>
        </div>

        <div class="filter-group">
          <h4>Category</h4>
          <label class="filter-option" *ngFor="let category of categories">
            <input type="checkbox" [value]="category" (change)="onCategoryChange($event, category)">
            <span>{{ category }}</span>
          </label>
        </div>

        <div class="filter-group">
          <h4>Price Range</h4>
          <label class="filter-option">
            <input type="checkbox" value="under3000" (change)="onPriceRangeChange($event, 'under3000')">
            <span>Under Rs. 3,000</span>
          </label>
          <label class="filter-option">
            <input type="checkbox" value="3000to3500" (change)="onPriceRangeChange($event, '3000to3500')">
            <span>Rs. 3,000 – 3,500</span>
          </label>
          <label class="filter-option">
            <input type="checkbox" value="3500to4000" (change)="onPriceRangeChange($event, '3500to4000')">
            <span>Rs. 3,500 – 4,000</span>
          </label>
          <label class="filter-option">
            <input type="checkbox" value="over4000" (change)="onPriceRangeChange($event, 'over4000')">
            <span>Over Rs. 4,000</span>
          </label>
        </div>

        <button type="button" class="btn btn-clear" (click)="clearFilters()">Clear Filters</button>
      </aside>

      <div class="shop-results">
        <div class="results-meta" *ngIf="filteredProducts.length > 0">
          <p>{{ filteredProducts.length }} {{ filteredProducts.length === 1 ? 'piece' : 'pieces' }}</p>
        </div>

        <div class="products-grid" *ngIf="filteredProducts.length > 0">
          <app-product-card *ngFor="let product of filteredProducts" [product]="product"></app-product-card>
        </div>

        <div class="no-products" *ngIf="filteredProducts.length === 0">
          <h2>No matches found</h2>
          <p>Try adjusting your category or price filters to explore more of the collection.</p>
          <button type="button" class="btn btn-secondary" (click)="clearFilters()">Clear Filters</button>
        </div>
      </div>
    </div>
  </div>
</div>
