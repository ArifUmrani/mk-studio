<header class="header">
  <div class="container">
    <div class="header-content">
      <a routerLink="/" class="logo" (click)="closeMobileMenu()">MK Studio</a>

      <button class="mobile-menu-toggle" (click)="toggleMobileMenu()" aria-label="Toggle menu">
        <span class="hamburger" [class.open]="mobileMenuOpen">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </button>

      <nav class="nav" [class.mobile-open]="mobileMenuOpen">
        <a routerLink="/" class="nav-link" routerLinkActive="active" (click)="closeMobileMenu()">Home</a>
        <a routerLink="/shop" class="nav-link" routerLinkActive="active" (click)="closeMobileMenu()">Shop</a>
        <a routerLink="/about" class="nav-link" routerLinkActive="active" (click)="closeMobileMenu()">About</a>
        <a routerLink="/contact" class="nav-link" routerLinkActive="active" (click)="closeMobileMenu()">Contact</a>
        <a routerLink="/cart" class="nav-link cart-link-mobile" routerLinkActive="active" (click)="closeMobileMenu()">
          Cart ({{ cartCount$ | async }})
        </a>
      </nav>

      <div class="header-actions desktop-only">
        <a routerLink="/cart" class="cart-link">
          Cart ({{ cartCount$ | async }})
        </a>
      </div>
    </div>
  </div>
</header>
