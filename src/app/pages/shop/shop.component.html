<div class="shop">
  <div class="container">
    <div class="shop-header">
      <h1>Shop</h1>
      <p>Browse our collection</p>
    </div>
    <div class="shop-content">
      <aside class="filters">
        <h3>Filters</h3>
        <div class="filter-group">
          <h4>Category</h4>
          <label><input type="checkbox"> Tops</label>
          <label><input type="checkbox"> Bottoms</label>
          <label><input type="checkbox"> Dresses</label>
          <label><input type="checkbox"> Accessories</label>
        </div>
        <div class="filter-group">
          <h4>Price Range</h4>
          <label><input type="checkbox"> Under $50</label>
          <label><input type="checkbox"> $50 - $100</label>
          <label><input type="checkbox"> $100 - $200</label>
          <label><input type="checkbox"> Over $200</label>
        </div>
      </aside>
      <div class="products-grid">
        <div class="product-card">
          <div class="product-image"></div>
          <div class="product-info">
            <h3>Classic White Tee</h3>
            <p class="product-price">$35.00</p>
            <button class="btn btn-secondary">View Details</button>
          </div>
        </div>
        <div class="product-card">
          <div class="product-image"></div>
          <div class="product-info">
            <h3>Denim Jacket</h3>
            <p class="product-price">$120.00</p>
            <button class="btn btn-secondary">View Details</button>
          </div>
        </div>
        <div class="product-card">
          <div class="product-image"></div>
          <div class="product-info">
            <h3>Summer Dress</h3>
            <p class="product-price">$85.00</p>
            <button class="btn btn-secondary">View Details</button>
          </div>
        </div>
        <div class="product-card">
          <div class="product-image"></div>
          <div class="product-info">
            <h3>Chino Pants</h3>
            <p class="product-price">$65.00</p>
            <button class="btn btn-secondary">View Details</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
