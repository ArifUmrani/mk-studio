<div class="product-details" *ngIf="product; else notFound">
  <div class="container">
    <div class="product-details-content">
      <div class="product-gallery">
        <div class="main-image" [style.background-image]="'url(' + product.image + ')'"></div>
        <div class="thumbnail-images">
          <div class="thumbnail" [style.background-image]="'url(' + product.image + ')'"></div>
          <div class="thumbnail" [style.background-image]="'url(' + product.image + ')'"></div>
          <div class="thumbnail" [style.background-image]="'url(' + product.image + ')'"></div>
        </div>
      </div>
      <div class="product-info">
        <h1>{{ product.name }}</h1>
        <p class="product-category">{{ product.category }}</p>
        <p class="product-price">${{ product.price.toFixed(2) }}</p>
        <p class="product-description">{{ product.description }}</p>
        <div class="product-options">
          <div class="size-selector">
            <h4>Size</h4>
            <div class="sizes">
              <button *ngFor="let size of product.sizes" class="size-btn" [class.active]="selectedSize === size"
                (click)="selectSize(size)">{{ size }}</button>
            </div>
          </div>
          <div class="color-selector">
            <h4>Color</h4>
            <div class="colors">
              <button *ngFor="let color of product.colors" class="color-btn" [class.active]="selectedColor === color"
                [style.background]="getColorStyle(color)" (click)="selectColor(color)"></button>
            </div>
          </div>
        </div>
        <div class="quantity-selector">
          <h4>Quantity</h4>
          <div class="quantity">
            <button class="qty-btn" (click)="decreaseQuantity()">-</button>
            <span class="qty-value">{{ quantity }}</span>
            <button class="qty-btn" (click)="increaseQuantity()">+</button>
          </div>
        </div>
        <div class="product-actions">
          <button class="btn btn-primary" (click)="addToCart()">Add to Cart</button>
          <button class="btn btn-secondary">Add to Wishlist</button>
        </div>
        <div *ngIf="showAddToCartMessage" class="add-to-cart-message"
          [class.success]="addToCartMessage.includes('successfully')"
          [class.error]="!addToCartMessage.includes('successfully')">
          {{ addToCartMessage }}
        </div>
      </div>
    </div>
  </div>
</div>

<ng-template #notFound>
  <div class="container">
    <div class="not-found">
      <h1>Product Not Found</h1>
      <p>The product you're looking for doesn't exist.</p>
      <button class="btn btn-primary" routerLink="/shop">Back to Shop</button>
    </div>
  </div>
</ng-template>
