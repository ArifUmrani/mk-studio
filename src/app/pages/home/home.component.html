<div class="home">
  <section class="hero">
    <div class="container">
      <div class="hero-content">
        <h1>Welcome to MK Studio</h1>
        <p>Discover our latest collection of modern, high-quality clothing designed for the contemporary lifestyle.</p>
        <a routerLink="/shop" class="btn btn-primary">Shop Now</a>
      </div>
    </div>
  </section>

  <section class="featured">
    <div class="container">
      <h2>Featured Collection</h2>
      <div class="featured-grid">
        <app-product-card *ngFor="let product of featuredProducts" [product]="product"></app-product-card>
      </div>
    </div>
  </section>
</div>
