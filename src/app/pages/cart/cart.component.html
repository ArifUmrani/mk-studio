<div class="cart">
  <div class="container">
    <h1>Shopping Cart</h1>
    <div class="cart-content">
      <div class="cart-items">
        <div class="cart-item">
          <div class="item-image"></div>
          <div class="item-details">
            <h3>Classic White Tee</h3>
            <p class="item-size">Size: M</p>
            <p class="item-color">Color: White</p>
            <p class="item-price">$35.00</p>
          </div>
          <div class="item-quantity">
            <button class="qty-btn">-</button>
            <span class="qty-value">1</span>
            <button class="qty-btn">+</button>
          </div>
          <div class="item-total">
            <p>$35.00</p>
            <button class="remove-btn">Remove</button>
          </div>
        </div>
        <div class="cart-item">
          <div class="item-image"></div>
          <div class="item-details">
            <h3>Denim Jacket</h3>
            <p class="item-size">Size: L</p>
            <p class="item-color">Color: Blue</p>
            <p class="item-price">$120.00</p>
          </div>
          <div class="item-quantity">
            <button class="qty-btn">-</button>
            <span class="qty-value">1</span>
            <button class="qty-btn">+</button>
          </div>
          <div class="item-total">
            <p>$120.00</p>
            <button class="remove-btn">Remove</button>
          </div>
        </div>
      </div>
      <div class="cart-summary">
        <h2>Order Summary</h2>
        <div class="summary-row">
          <span>Subtotal</span>
          <span>$155.00</span>
        </div>
        <div class="summary-row">
          <span>Shipping</span>
          <span>$10.00</span>
        </div>
        <div class="summary-row">
          <span>Tax</span>
          <span>$15.50</span>
        </div>
        <div class="summary-row total">
          <span>Total</span>
          <span>$180.50</span>
        </div>
        <button class="btn btn-primary">Proceed to Checkout</button>
        <button class="btn btn-secondary">Continue Shopping</button>
      </div>
    </div>
  </div>
</div>
